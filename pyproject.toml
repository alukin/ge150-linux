[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ge150"
version = "0.1.0"
description = "Linux editor and CLI for the Mooer GE150 multi-effects pedal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.2"]
gui = ["PySide6>=6.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ge150ctl = "ge150.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ge150 = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["ge150"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["usb", "usb.*"]
ignore_missing_imports = true
