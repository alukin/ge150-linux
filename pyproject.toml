[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ge150"
version = "0.1.0"
description = "Linux editor and CLI for the Mooer GE150 multi-effects pedal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.2"]
gui = ["PySide6>=6.5", "markdown-it-py>=3"]
ai = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ge150ctl = "ge150.cli:main"
ge150 = "ge150.ui.app:main"
ge150-mcp = "ge150.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ge150 = ["data/*.json", "data/*.svg", "data/photos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["ge150"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["usb", "usb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The distribution PySide6 may ship without type stubs: Qt classes are then ``Any``.
module = ["ge150.ui.*"]
disallow_subclassing_any = false
warn_return_any = false
